# Render blueprint for the Personal Finance Dashboard.
# One Free web service serves Django + the built React SPA from a single
# domain; the database is a Neon Free Postgres project (created separately
# in the Neon dashboard — its pooled URL goes into DATABASE_URL below).
# Docs: README.md "Deployment (Render + Neon, free)".
services:
  - type: web
    name: personal-finance-dashboard
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt
      && npm ci --prefix frontend
      && npm run build --prefix frontend
      && python manage.py collectstatic --noinput
      && python manage.py migrate
    startCommand: gunicorn finance.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      # Pin Python: Render's default (3.14) has no wheel for
      # psycopg-binary 3.2.6, so the build would fall back to
      # building it from source. 3.13.5 is what the service runs.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_DEBUG
        value: "false"
      # Render generates a fresh secret on first deploy; never commit one.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Fill in after creating the Neon project (pooled URL, ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Fill in after the first deploy, once the .onrender.com URL exists.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Google/GitHub sign-in (django-allauth): create the OAuth apps
      # yourself and fill these in. Buttons stay hidden until a pair
      # is set. Password-reset mail needs the EMAIL_* vars.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
